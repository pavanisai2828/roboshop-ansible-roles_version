- name: install mysql
  ansible.builtin.package:
    name: mysql-server
    state: present
- name: starting mysql
  ansible.builtin.service:
    name: mysqld
    state: started
    enabled: yes
- name: set root passoword
  ansible.builtin.command:
    cmd: mysql_secure_installation --set-root-pass "{{ MYSQL_ROOT_PASSWORD }}" 