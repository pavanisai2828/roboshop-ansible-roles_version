- name: application setup
  ansible.builtin.import_role:
    name: common
    tasks_from: nodejs.yaml

- name: configure application
  ansible.builtin.import_role:
    name: common
    tasks_from: app-setup.yaml
- name: systemd setup
  ansible.builtin.import_role:
    name: common
    tasks_from: systemd_service
- name: copy mongo.repo 
  ansible.builtin.copy:
    src: mong.repo
    dest: /etc/yum.repos.d/mongo.repo
- name: install mongodb client
  ansible.builtin.package:
    name: mongodb-mongosh
    state: present
  tags:
  - mongodb
- name: check catalogue schema exists or not
  ansible.builtin.shell: mongosh --host "{{ MONGODB_HOST }}" --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
  register: catalogue_output
#   tags:
#   - mongodb
# - name: print catalogue_output
#   debug:
#     msg: "{{ catalogue_output }}"
#   tags:
#   - mongodb
- name: load master data
  ansible.builtin.shell: mongosh --host "{{ MONGODB_HOST }}" </app/db/master-data.js
  when: catalogue_output.stdout | int < 0
  # tags:
  # - mongodb
- name: enable and start catalogue
  ansible.builtin.service:
    name: catalogue
    state: restarted
    enabled: yes











