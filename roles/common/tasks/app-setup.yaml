- name: configure the application by cretaing system user
  ansible.builtin.user:
    name: roboshop
    system: True
    home: /app
    shell: /sbin/nologin
    comment: roboshop system user
- name: remove /app directory
  ansible.builtin.file:                                                                                                                                             
    path: /app
    state: absent

- name: delete "{{ component }}".zip in tmp directory
  ansible.builtin.file:
    path: "/tmp/{{ component }}.zip"
    state: absent

- name: crete /app directory
  ansible.builtin.file:
    path: /app
    state: directory

- name: download "{{ component }}".zip file
  ansible.builtin.get_url:
    url: "https://roboshop-artifacts.s3.amazonaws.com/{{ component }}-v3.zip"
    dest: "/tmp/ {{ component }} .zip"


- name: unzip catalogue.zip
  ansible.builtin.unarchive:
    src: "/tmp/{{ component }}.zip"
    dest: /app
    remote_src: yes 
- name: install dependencies
  community.general.npm:
    path: /app
